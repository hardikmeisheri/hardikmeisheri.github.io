<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" style="background:#ffffff">
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- ── Game Board (7×7) ── -->
  <rect x="16" y="16" width="182" height="182" rx="6" fill="#1e293b"/>

  <!-- Grid cells -->
  <g fill="#334155">
    <!-- Indestructible walls (fixed grid) -->
    <rect x="16" y="16" width="26" height="26" rx="2" fill="#0f172a"/>
    <rect x="68" y="16" width="26" height="26" rx="2" fill="#0f172a"/>
    <rect x="120" y="16" width="26" height="26" rx="2" fill="#0f172a"/>
    <rect x="172" y="16" width="26" height="26" rx="2" fill="#0f172a"/>
    <rect x="16" y="68" width="26" height="26" rx="2" fill="#0f172a"/>
    <rect x="68" y="68" width="26" height="26" rx="2" fill="#0f172a"/>
    <rect x="120" y="68" width="26" height="26" rx="2" fill="#0f172a"/>
    <rect x="172" y="68" width="26" height="26" rx="2" fill="#0f172a"/>
    <rect x="16" y="120" width="26" height="26" rx="2" fill="#0f172a"/>
    <rect x="68" y="120" width="26" height="26" rx="2" fill="#0f172a"/>
    <rect x="120" y="120" width="26" height="26" rx="2" fill="#0f172a"/>
    <rect x="172" y="120" width="26" height="26" rx="2" fill="#0f172a"/>
    <rect x="16" y="172" width="26" height="26" rx="2" fill="#0f172a"/>
    <rect x="68" y="172" width="26" height="26" rx="2" fill="#0f172a"/>
    <rect x="120" y="172" width="26" height="26" rx="2" fill="#0f172a"/>
    <rect x="172" y="172" width="26" height="26" rx="2" fill="#0f172a"/>
  </g>

  <!-- Destructible blocks (wood) -->
  <g fill="#854d0e" opacity="0.8">
    <rect x="44" y="44" width="22" height="22" rx="2"/>
    <rect x="148" y="44" width="22" height="22" rx="2"/>
    <rect x="96" y="44" width="22" height="22" rx="2"/>
    <rect x="44" y="148" width="22" height="22" rx="2"/>
    <rect x="148" y="148" width="22" height="22" rx="2"/>
    <rect x="96" y="148" width="22" height="22" rx="2"/>
    <rect x="44" y="96" width="22" height="22" rx="2"/>
    <rect x="148" y="96" width="22" height="22" rx="2"/>
  </g>

  <!-- ── Bomb ── -->
  <circle cx="108" cy="82" r="10" fill="#ef4444"/>
  <text x="108" y="86" text-anchor="middle" font-size="11" fill="#ffffff" font-family="Inter, sans-serif">💣</text>
  <!-- Blast radius lines -->
  <line x1="108" y1="68" x2="108" y2="56" stroke="#f97316" stroke-width="2" stroke-dasharray="3 2" opacity="0.7"/>
  <line x1="96" y1="82" x2="84" y2="82" stroke="#f97316" stroke-width="2" stroke-dasharray="3 2" opacity="0.7"/>
  <line x1="120" y1="82" x2="132" y2="82" stroke="#f97316" stroke-width="2" stroke-dasharray="3 2" opacity="0.7"/>

  <!-- ── Agent 1 (Team Blue) ── -->
  <circle cx="30" cy="30" r="11" fill="#3b82f6" stroke="#ffffff" stroke-width="1.5"/>
  <text x="30" y="34" text-anchor="middle" font-size="10" fill="#ffffff" font-family="Inter, sans-serif" font-weight="700">A</text>

  <!-- ── Agent 2 (Team Blue) ── -->
  <circle cx="186" cy="186" r="11" fill="#3b82f6" stroke="#ffffff" stroke-width="1.5"/>
  <text x="186" y="190" text-anchor="middle" font-size="10" fill="#ffffff" font-family="Inter, sans-serif" font-weight="700">B</text>

  <!-- ── Enemy 1 (Red) ── -->
  <circle cx="186" cy="30" r="11" fill="#ef4444" stroke="#ffffff" stroke-width="1.5"/>
  <text x="186" y="34" text-anchor="middle" font-size="10" fill="#ffffff" font-family="Inter, sans-serif" font-weight="700">E</text>

  <!-- ── Enemy 2 (Red) ── -->
  <circle cx="30" cy="186" r="11" fill="#ef4444" stroke="#ffffff" stroke-width="1.5"/>
  <text x="30" y="190" text-anchor="middle" font-size="10" fill="#ffffff" font-family="Inter, sans-serif" font-weight="700">E</text>

  <!-- ── Right side: Training diagram ── -->
  <text x="216" y="34" font-size="11" fill="#1e293b" font-family="Inter, sans-serif" font-weight="700">Training Pipeline</text>

  <!-- Imitation Learning phase -->
  <rect x="216" y="44" width="168" height="44" rx="7" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="300" y="62" text-anchor="middle" font-size="9.5" fill="#1d4ed8" font-family="Inter, sans-serif" font-weight="600">① Imitation Learning</text>
  <text x="300" y="76" text-anchor="middle" font-size="8.5" fill="#1d4ed8" font-family="Inter, sans-serif">noisy expert policy → seed</text>

  <!-- Arrow -->
  <line x1="300" y1="90" x2="300" y2="102" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- PPO phase -->
  <rect x="216" y="104" width="168" height="44" rx="7" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="300" y="122" text-anchor="middle" font-size="9.5" fill="#15803d" font-family="Inter, sans-serif" font-weight="600">② PPO + Reward Shaping</text>
  <text x="300" y="136" text-anchor="middle" font-size="8.5" fill="#15803d" font-family="Inter, sans-serif">curriculum · action filter</text>

  <!-- Arrow -->
  <line x1="300" y1="150" x2="300" y2="162" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Result -->
  <rect x="216" y="164" width="168" height="34" rx="7" fill="#fef9c3" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="300" y="179" text-anchor="middle" font-size="9.5" fill="#92400e" font-family="Inter, sans-serif" font-weight="600">Beats heuristic baselines</text>
  <text x="300" y="191" text-anchor="middle" font-size="8.5" fill="#b45309" font-family="Inter, sans-serif">100k games · NeurIPS 2019</text>

  <!-- Caption -->
  <text x="16" y="218" font-size="9" fill="#94a3b8" font-family="Inter, sans-serif">Pommerman (Bomberman-like) · Multi-agent competitive environment</text>
</svg>
