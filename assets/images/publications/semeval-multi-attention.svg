<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" style="background:#ffffff">
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- ── Tweet input ── -->
  <rect x="16" y="40" width="90" height="68" rx="7" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="61" y="58" text-anchor="middle" font-size="9" fill="#64748b" font-family="Inter, sans-serif" font-weight="600">Tweet</text>
  <!-- Simulated text lines -->
  <rect x="24" y="64" width="74" height="6" rx="2" fill="#cbd5e1"/>
  <rect x="24" y="74" width="60" height="6" rx="2" fill="#cbd5e1"/>
  <rect x="24" y="84" width="68" height="6" rx="2" fill="#cbd5e1"/>
  <rect x="24" y="94" width="44" height="6" rx="2" fill="#e2e8f0"/>

  <!-- Arrow -->
  <line x1="108" y1="74" x2="126" y2="74" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── Embeddings ── -->
  <rect x="128" y="50" width="52" height="46" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="154" y="70" text-anchor="middle" font-size="8.5" fill="#6d28d9" font-family="Inter, sans-serif" font-weight="600">Mixed</text>
  <text x="154" y="82" text-anchor="middle" font-size="8.5" fill="#6d28d9" font-family="Inter, sans-serif" font-weight="600">Embed-</text>
  <text x="154" y="92" text-anchor="middle" font-size="8.5" fill="#6d28d9" font-family="Inter, sans-serif">dings</text>

  <!-- Arrow -->
  <line x1="182" y1="74" x2="200" y2="74" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── Multi-Attention ── -->
  <rect x="202" y="32" width="76" height="110" rx="8" fill="#fdf4ff" stroke="#a855f7" stroke-width="2"/>
  <text x="240" y="50" text-anchor="middle" font-size="9" fill="#7e22ce" font-family="Inter, sans-serif" font-weight="700">Multi-Attention</text>

  <!-- Attention heads (vertical stripes) -->
  <g opacity="0.85">
    <rect x="210" y="56" width="12" height="60" rx="3" fill="#a855f7" opacity="0.3"/>
    <rect x="226" y="63" width="12" height="53" rx="3" fill="#a855f7" opacity="0.45"/>
    <rect x="242" y="58" width="12" height="58" rx="3" fill="#a855f7" opacity="0.55"/>
    <rect x="258" y="67" width="12" height="49" rx="3" fill="#a855f7" opacity="0.35"/>
    <!-- highlight bars (attention peaks) -->
    <rect x="210" y="74" width="12" height="12" rx="2" fill="#7c3aed"/>
    <rect x="242" y="82" width="12" height="10" rx="2" fill="#7c3aed"/>
    <rect x="226" y="91" width="12" height="11" rx="2" fill="#7c3aed"/>
    <rect x="258" y="78" width="12" height="10" rx="2" fill="#7c3aed"/>
  </g>

  <!-- Word attention highlights at bottom of heads -->
  <text x="216" y="128" text-anchor="middle" font-size="7.5" fill="#6d28d9" font-family="Inter, sans-serif">h₁</text>
  <text x="232" y="128" text-anchor="middle" font-size="7.5" fill="#6d28d9" font-family="Inter, sans-serif">h₂</text>
  <text x="248" y="128" text-anchor="middle" font-size="7.5" fill="#6d28d9" font-family="Inter, sans-serif">h₃</text>
  <text x="264" y="128" text-anchor="middle" font-size="7.5" fill="#6d28d9" font-family="Inter, sans-serif">h₄</text>

  <!-- Arrow -->
  <line x1="280" y1="87" x2="296" y2="87" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── Emotion outputs ── -->
  <text x="306" y="44" font-size="9" fill="#1e293b" font-family="Inter, sans-serif" font-weight="700">Emotion Intensity</text>

  <!-- Bar for joy -->
  <text x="300" y="60" font-size="8.5" fill="#64748b" font-family="Inter, sans-serif">Joy</text>
  <rect x="324" y="50" width="68" height="12" rx="3" fill="#e2e8f0"/>
  <rect x="324" y="50" width="56" height="12" rx="3" fill="#f59e0b"/>
  <text x="396" y="60" text-anchor="end" font-size="7.5" fill="#92400e" font-family="Inter, sans-serif">0.82</text>

  <!-- Bar for fear -->
  <text x="300" y="80" font-size="8.5" fill="#64748b" font-family="Inter, sans-serif">Fear</text>
  <rect x="324" y="70" width="68" height="12" rx="3" fill="#e2e8f0"/>
  <rect x="324" y="70" width="28" height="12" rx="3" fill="#ef4444"/>
  <text x="396" y="80" text-anchor="end" font-size="7.5" fill="#b91c1c" font-family="Inter, sans-serif">0.41</text>

  <!-- Bar for sadness -->
  <text x="294" y="100" font-size="8.5" fill="#64748b" font-family="Inter, sans-serif">Sadness</text>
  <rect x="324" y="90" width="68" height="12" rx="3" fill="#e2e8f0"/>
  <rect x="324" y="90" width="20" height="12" rx="3" fill="#3b82f6"/>
  <text x="396" y="100" text-anchor="end" font-size="7.5" fill="#1d4ed8" font-family="Inter, sans-serif">0.29</text>

  <!-- Bar for anger -->
  <text x="300" y="120" font-size="8.5" fill="#64748b" font-family="Inter, sans-serif">Anger</text>
  <rect x="324" y="110" width="68" height="12" rx="3" fill="#e2e8f0"/>
  <rect x="324" y="110" width="40" height="12" rx="3" fill="#8b5cf6"/>
  <text x="396" y="120" text-anchor="end" font-size="7.5" fill="#6d28d9" font-family="Inter, sans-serif">0.59</text>

  <!-- SVM ensemble note -->
  <rect x="202" y="154" width="182" height="38" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="293" y="170" text-anchor="middle" font-size="9" fill="#15803d" font-family="Inter, sans-serif" font-weight="600">SVM Ensemble</text>
  <text x="293" y="183" text-anchor="middle" font-size="8" fill="#15803d" font-family="Inter, sans-serif">Deep features + traditional feats</text>

  <!-- Rank badge -->
  <rect x="290" y="200" width="96" height="28" rx="6" fill="#fef9c3" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="338" y="218" text-anchor="middle" font-size="9" fill="#92400e" font-family="Inter, sans-serif" font-weight="700">🏅 Ranked 2nd / 75 teams</text>

  <!-- Caption -->
  <text x="16" y="220" font-size="9" fill="#94a3b8" font-family="Inter, sans-serif">SemEval-2018 Task 1 · Affect in Tweets · NAACL 2018</text>
</svg>
