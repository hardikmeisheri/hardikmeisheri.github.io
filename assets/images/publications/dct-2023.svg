<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" style="background:#ffffff">
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="200" y="22" text-anchor="middle" font-size="10.5" fill="#64748b" font-family="Inter, sans-serif" font-weight="700" letter-spacing="0.3">DUAL CHANNEL TRAINING (DCT)</text>

  <!-- ── Channel 1: Behavioral (left column) ── -->
  <text x="80" y="44" text-anchor="middle" font-size="9" fill="#4f46e5" font-family="Inter, sans-serif" font-weight="600">Channel 1: Behavioral</text>

  <!-- State box -->
  <rect x="30" y="52" width="100" height="26" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="80" y="70" text-anchor="middle" font-size="9" fill="#1d4ed8" font-family="Inter, sans-serif" font-weight="500">State s</text>

  <line x1="80" y1="78" x2="80" y2="90" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Policy network -->
  <rect x="30" y="92" width="100" height="26" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="80" y="110" text-anchor="middle" font-size="9" fill="#1d4ed8" font-family="Inter, sans-serif" font-weight="500">Policy π(s)</text>

  <line x1="80" y1="118" x2="80" y2="130" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Action embedding lookup -->
  <rect x="30" y="132" width="100" height="26" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="80" y="148" text-anchor="middle" font-size="9" fill="#1d4ed8" font-family="Inter, sans-serif">Emb(a) lookup</text>

  <line x1="80" y1="158" x2="80" y2="170" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Action -->
  <rect x="50" y="172" width="60" height="24" rx="12" fill="#3b82f6"/>
  <text x="80" y="188" text-anchor="middle" font-size="9" fill="#ffffff" font-family="Inter, sans-serif" font-weight="600">Action a</text>

  <!-- ── Channel 2: Semantic (right column) ── -->
  <text x="310" y="44" text-anchor="middle" font-size="9" fill="#0f766e" font-family="Inter, sans-serif" font-weight="600">Channel 2: Semantic</text>

  <!-- Action desc box -->
  <rect x="260" y="52" width="100" height="26" rx="5" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="310" y="66" text-anchor="middle" font-size="8.5" fill="#0f766e" font-family="Inter, sans-serif" font-weight="500">Action desc.</text>
  <text x="310" y="76" text-anchor="middle" font-size="8" fill="#0f766e" font-family="Inter, sans-serif">"move north"</text>

  <line x1="310" y1="78" x2="310" y2="90" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Language encoder -->
  <rect x="260" y="92" width="100" height="26" rx="5" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="310" y="106" text-anchor="middle" font-size="8.5" fill="#0f766e" font-family="Inter, sans-serif" font-weight="500">LM Encoder</text>
  <text x="310" y="116" text-anchor="middle" font-size="7.5" fill="#0f766e" font-family="Inter, sans-serif">(BERT/GPT)</text>

  <line x1="310" y1="118" x2="310" y2="130" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Semantic emb -->
  <rect x="260" y="132" width="100" height="26" rx="5" fill="#99f6e4" stroke="#0d9488" stroke-width="1.5"/>
  <text x="310" y="148" text-anchor="middle" font-size="9" fill="#0f766e" font-family="Inter, sans-serif">Semantic Emb</text>

  <line x1="310" y1="158" x2="310" y2="170" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Action -->
  <rect x="280" y="172" width="60" height="24" rx="12" fill="#0d9488"/>
  <text x="310" y="188" text-anchor="middle" font-size="9" fill="#ffffff" font-family="Inter, sans-serif" font-weight="600">Action a</text>

  <!-- ── Shared Embedding Space (center) ── -->
  <rect x="148" y="92" width="104" height="66" rx="8" fill="#fef9c3" stroke="#f59e0b" stroke-width="2"/>
  <text x="200" y="114" text-anchor="middle" font-size="9.5" fill="#92400e" font-family="Inter, sans-serif" font-weight="700">Shared</text>
  <text x="200" y="127" text-anchor="middle" font-size="9.5" fill="#92400e" font-family="Inter, sans-serif" font-weight="700">Action</text>
  <text x="200" y="140" text-anchor="middle" font-size="9.5" fill="#92400e" font-family="Inter, sans-serif" font-weight="700">Embedding</text>
  <text x="200" y="153" text-anchor="middle" font-size="8" fill="#b45309" font-family="Inter, sans-serif">joint training</text>

  <!-- Arrows from channels to shared -->
  <line x1="130" y1="132" x2="148" y2="125" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arr)" stroke-dasharray="3 2"/>
  <line x1="260" y1="145" x2="252" y2="145" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arr)" stroke-dasharray="3 2"/>

  <!-- Result badge -->
  <rect x="138" y="180" width="124" height="34" rx="7" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="200" y="196" text-anchor="middle" font-size="9" fill="#15803d" font-family="Inter, sans-serif" font-weight="600">Large Action Spaces</text>
  <text x="200" y="208" text-anchor="middle" font-size="8" fill="#16a34a" font-family="Inter, sans-serif">|A| up to 10⁶ · scalable</text>

  <!-- Caption -->
  <text x="16" y="232" font-size="9" fill="#94a3b8" font-family="Inter, sans-serif">DCT: Dual Channel Training · Action Embedding for Large Discrete Action Spaces · 2023</text>
</svg>
