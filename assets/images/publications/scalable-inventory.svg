<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" style="background:#ffffff">
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- ── Title label ── -->
  <text x="200" y="22" text-anchor="middle" font-size="11" fill="#64748b" font-family="Inter, sans-serif" font-weight="600" letter-spacing="0.3">MULTI-PRODUCT INVENTORY RL</text>

  <!-- ── Products (left column) ── -->
  <!-- Product 1 -->
  <rect x="18" y="40" width="52" height="30" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="44" y="54" text-anchor="middle" font-size="8" fill="#1d4ed8" font-family="Inter, sans-serif" font-weight="500">Product 1</text>
  <text x="44" y="64" text-anchor="middle" font-size="7" fill="#3b82f6" font-family="Inter, sans-serif">demand~P</text>

  <!-- Product 2 -->
  <rect x="18" y="82" width="52" height="30" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="44" y="96" text-anchor="middle" font-size="8" fill="#1d4ed8" font-family="Inter, sans-serif" font-weight="500">Product 2</text>
  <text x="44" y="106" text-anchor="middle" font-size="7" fill="#3b82f6" font-family="Inter, sans-serif">lead time L</text>

  <!-- Ellipsis -->
  <text x="44" y="132" text-anchor="middle" font-size="14" fill="#94a3b8" font-family="Inter, sans-serif">⋮</text>

  <!-- Product N -->
  <rect x="18" y="148" width="52" height="30" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="44" y="162" text-anchor="middle" font-size="8" fill="#1d4ed8" font-family="Inter, sans-serif" font-weight="500">Product N</text>
  <text x="44" y="172" text-anchor="middle" font-size="7" fill="#3b82f6" font-family="Inter, sans-serif">N up to 220</text>

  <!-- ── Meta-model layer ── -->
  <rect x="102" y="48" width="54" height="22" rx="5" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.3"/>
  <text x="129" y="63" text-anchor="middle" font-size="8.5" fill="#16a34a" font-family="Inter, sans-serif" font-weight="500">meta-model</text>
  <rect x="102" y="89" width="54" height="22" rx="5" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.3"/>
  <text x="129" y="104" text-anchor="middle" font-size="8.5" fill="#16a34a" font-family="Inter, sans-serif" font-weight="500">meta-model</text>
  <rect x="102" y="153" width="54" height="22" rx="5" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.3"/>
  <text x="129" y="168" text-anchor="middle" font-size="8.5" fill="#16a34a" font-family="Inter, sans-serif" font-weight="500">meta-model</text>
  <text x="129" y="140" text-anchor="middle" font-size="12" fill="#94a3b8" font-family="Inter, sans-serif">⋮</text>

  <!-- Arrows: products → meta-models -->
  <line x1="71" y1="55" x2="100" y2="59" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="71" y1="97" x2="100" y2="100" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="71" y1="163" x2="100" y2="164" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Arrows: meta-models → RL agent -->
  <line x1="157" y1="59" x2="194" y2="95" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="157" y1="100" x2="194" y2="108" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="157" y1="164" x2="194" y2="130" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- ── RL Agent ── -->
  <circle cx="218" cy="113" r="40" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="218" y="108" text-anchor="middle" font-size="10" fill="#92400e" font-family="Inter, sans-serif" font-weight="700">RL</text>
  <text x="218" y="122" text-anchor="middle" font-size="10" fill="#92400e" font-family="Inter, sans-serif" font-weight="700">Agent</text>

  <!-- Arrow: RL → Decision -->
  <line x1="258" y1="113" x2="285" y2="113" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── Decision output ── -->
  <rect x="288" y="80" width="90" height="66" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="333" y="100" text-anchor="middle" font-size="9" fill="#92400e" font-family="Inter, sans-serif" font-weight="600">Order Quantity</text>
  <text x="333" y="115" text-anchor="middle" font-size="8" fill="#b45309" font-family="Inter, sans-serif">q₁, q₂, …, qₙ</text>
  <!-- Mini bars representing decisions -->
  <rect x="300" y="122" width="8" height="14" rx="1" fill="#fcd34d"/>
  <rect x="312" y="126" width="8" height="10" rx="1" fill="#fcd34d"/>
  <rect x="324" y="119" width="8" height="17" rx="1" fill="#fcd34d"/>
  <rect x="336" y="124" width="8" height="12" rx="1" fill="#fcd34d"/>
  <rect x="348" y="121" width="8" height="15" rx="1" fill="#fcd34d"/>
  <rect x="360" y="127" width="8" height="9" rx="1" fill="#fcd34d"/>

  <!-- ── Caption ── -->
  <text x="200" y="220" text-anchor="middle" font-size="9" fill="#94a3b8" font-family="Inter, sans-serif">100–220 concurrent products · transfer learning without retraining</text>
</svg>
