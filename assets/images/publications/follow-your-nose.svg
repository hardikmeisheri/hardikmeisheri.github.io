<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" style="background:#ffffff">
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#94a3b8"/>
    </marker>
    <radialGradient id="gvf1" cx="55%" cy="75%" r="60%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gvf2" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ── Grid background ── -->
  <rect x="14" y="18" width="170" height="170" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Grid lines (7x7) -->
  <g stroke="#e2e8f0" stroke-width="0.8">
    <line x1="38" y1="18" x2="38" y2="188"/> <line x1="62" y1="18" x2="62" y2="188"/>
    <line x1="86" y1="18" x2="86" y2="188"/> <line x1="110" y1="18" x2="110" y2="188"/>
    <line x1="134" y1="18" x2="134" y2="188"/> <line x1="158" y1="18" x2="158" y2="188"/>
    <line x1="14" y1="42" x2="184" y2="42"/>  <line x1="14" y1="66" x2="184" y2="66"/>
    <line x1="14" y1="90" x2="184" y2="90"/>  <line x1="14" y1="114" x2="184" y2="114"/>
    <line x1="14" y1="138" x2="184" y2="138"/> <line x1="14" y1="162" x2="184" y2="162"/>
  </g>

  <!-- GVF signal overlays (gradient heat) -->
  <rect x="14" y="18" width="170" height="170" fill="url(#gvf1)" rx="6"/>
  <rect x="14" y="18" width="170" height="170" fill="url(#gvf2)" rx="6"/>

  <!-- Walls -->
  <rect x="62" y="66" width="24" height="72" rx="3" fill="#334155" opacity="0.7"/>
  <rect x="110" y="42" width="24" height="48" rx="3" fill="#334155" opacity="0.7"/>

  <!-- Goal (star) -->
  <circle cx="171" cy="175" r="10" fill="#f59e0b" opacity="0.9"/>
  <text x="171" y="179" text-anchor="middle" font-size="11" fill="#ffffff" font-family="Inter, sans-serif">★</text>

  <!-- Agent -->
  <circle cx="26" cy="30" r="9" fill="#0d9488"/>
  <circle cx="26" cy="30" r="5" fill="#ffffff" opacity="0.5"/>

  <!-- Agent path (planned exploration) -->
  <polyline points="26,30 26,54 26,78 50,78 50,102 50,126 74,126 98,126 98,150 122,150 146,150 146,174 171,174"
    fill="none" stroke="#0d9488" stroke-width="2" stroke-dasharray="5 3" opacity="0.8"/>

  <!-- GVF cues (small arrows indicating gradient) -->
  <g fill="#0d9488" opacity="0.6">
    <polygon points="97,104 104,104 100,97" />
    <polygon points="121,128 128,128 124,121" />
    <polygon points="145,152 152,152 148,145" />
  </g>

  <!-- ── Right side: GVF diagram ── -->
  <text x="210" y="36" font-size="11" fill="#1e293b" font-family="Inter, sans-serif" font-weight="700">General Value Functions</text>
  <text x="210" y="50" font-size="9" fill="#64748b" font-family="Inter, sans-serif">Auxiliary tasks guide exploration</text>

  <!-- GVF boxes -->
  <rect x="210" y="62" width="160" height="38" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="290" y="80" text-anchor="middle" font-size="9" fill="#0f766e" font-family="Inter, sans-serif" font-weight="600">GVF₁: distance to goal</text>
  <text x="290" y="92" text-anchor="middle" font-size="8" fill="#0f766e" font-family="Inter, sans-serif">V(s) = E[Σ γᵏ cₖ]</text>

  <rect x="210" y="110" width="160" height="38" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="290" y="128" text-anchor="middle" font-size="9" fill="#6d28d9" font-family="Inter, sans-serif" font-weight="600">GVF₂: obstacle proximity</text>
  <text x="290" y="140" text-anchor="middle" font-size="8" fill="#6d28d9" font-family="Inter, sans-serif">learned as aux. task</text>

  <!-- Arrow down to policy -->
  <line x1="290" y1="150" x2="290" y2="164" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="210" y="166" width="160" height="38" rx="6" fill="#fef9c3" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="290" y="184" text-anchor="middle" font-size="9" fill="#92400e" font-family="Inter, sans-serif" font-weight="600">Directed Exploration Policy</text>
  <text x="290" y="196" text-anchor="middle" font-size="8" fill="#b45309" font-family="Inter, sans-serif">option learning without handcrafting</text>

  <!-- Caption -->
  <text x="14" y="214" font-size="9" fill="#94a3b8" font-family="Inter, sans-serif">Navigation task with sparse rewards · AAAI 2022</text>
</svg>
