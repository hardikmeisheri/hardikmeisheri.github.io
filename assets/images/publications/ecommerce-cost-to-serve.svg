<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" style="background:#ffffff">
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="200" y="22" text-anchor="middle" font-size="10.5" fill="#64748b" font-family="Inter, sans-serif" font-weight="700" letter-spacing="0.3">E-COMMERCE COST-TO-SERVE OPTIMIZATION</text>

  <!-- ── Network graph: Suppliers → DCs → Customers ── -->

  <!-- Suppliers (left) -->
  <text x="46" y="46" text-anchor="middle" font-size="8.5" fill="#475569" font-family="Inter, sans-serif" font-weight="600">Suppliers</text>
  <circle cx="46" cy="72" r="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="46" y="76" text-anchor="middle" font-size="9" fill="#1d4ed8" font-family="Inter, sans-serif" font-weight="600">S₁</text>
  <circle cx="46" cy="110" r="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="46" y="114" text-anchor="middle" font-size="9" fill="#1d4ed8" font-family="Inter, sans-serif" font-weight="600">S₂</text>
  <circle cx="46" cy="148" r="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="46" y="152" text-anchor="middle" font-size="9" fill="#1d4ed8" font-family="Inter, sans-serif" font-weight="600">S₃</text>

  <!-- Distribution Centers (middle) -->
  <text x="160" y="46" text-anchor="middle" font-size="8.5" fill="#475569" font-family="Inter, sans-serif" font-weight="600">Fulfillment</text>
  <rect x="130" y="75" width="60" height="28" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="160" y="89" text-anchor="middle" font-size="9" fill="#92400e" font-family="Inter, sans-serif" font-weight="500">FC Node</text>
  <text x="160" y="99" text-anchor="middle" font-size="7.5" fill="#b45309" font-family="Inter, sans-serif">inventory</text>
  <rect x="130" y="118" width="60" height="28" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="160" y="132" text-anchor="middle" font-size="9" fill="#92400e" font-family="Inter, sans-serif" font-weight="500">FC Node</text>
  <text x="160" y="142" text-anchor="middle" font-size="7.5" fill="#b45309" font-family="Inter, sans-serif">routing</text>

  <!-- Customers (right) -->
  <text x="278" y="46" text-anchor="middle" font-size="8.5" fill="#475569" font-family="Inter, sans-serif" font-weight="600">Customers</text>
  <circle cx="278" cy="72" r="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="278" y="76" text-anchor="middle" font-size="9" fill="#15803d" font-family="Inter, sans-serif">C₁</text>
  <circle cx="278" cy="100" r="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="278" y="104" text-anchor="middle" font-size="9" fill="#15803d" font-family="Inter, sans-serif">C₂</text>
  <circle cx="278" cy="128" r="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="278" y="132" text-anchor="middle" font-size="9" fill="#15803d" font-family="Inter, sans-serif">C₃</text>
  <circle cx="278" cy="156" r="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="278" y="160" text-anchor="middle" font-size="9" fill="#15803d" font-family="Inter, sans-serif">C₄</text>

  <!-- Arrows S → FC -->
  <line x1="60" y1="72" x2="128" y2="85" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="60" y1="110" x2="128" y2="95" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="60" y1="148" x2="128" y2="132" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Arrows FC → C -->
  <line x1="190" y1="86" x2="264" y2="74" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="190" y1="90" x2="264" y2="101" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="190" y1="132" x2="264" y2="128" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="190" y1="136" x2="264" y2="155" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── RL Agent box ── -->
  <rect x="320" y="60" width="68" height="110" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="354" y="82" text-anchor="middle" font-size="10" fill="#92400e" font-family="Inter, sans-serif" font-weight="700">RL</text>
  <text x="354" y="95" text-anchor="middle" font-size="10" fill="#92400e" font-family="Inter, sans-serif" font-weight="700">Agent</text>
  <text x="354" y="112" text-anchor="middle" font-size="8" fill="#b45309" font-family="Inter, sans-serif">minimize</text>
  <text x="354" y="123" text-anchor="middle" font-size="8" fill="#b45309" font-family="Inter, sans-serif">cost-to-</text>
  <text x="354" y="134" text-anchor="middle" font-size="8" fill="#b45309" font-family="Inter, sans-serif">serve</text>
  <text x="354" y="148" text-anchor="middle" font-size="8" fill="#b45309" font-family="Inter, sans-serif">& routing</text>
  <text x="354" y="162" text-anchor="middle" font-size="8" fill="#b45309" font-family="Inter, sans-serif">decisions</text>

  <!-- Arrow network → RL -->
  <line x1="291" y1="114" x2="318" y2="114" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arr)" stroke-dasharray="3 2"/>

  <!-- Caption and result -->
  <rect x="16" y="182" width="290" height="42" rx="7" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="161" y="199" text-anchor="middle" font-size="9" fill="#1e293b" font-family="Inter, sans-serif" font-weight="600">Multi-Node Multi-Product Fulfilment</text>
  <text x="161" y="212" text-anchor="middle" font-size="8" fill="#64748b" font-family="Inter, sans-serif">Joint sourcing + routing · MARL · NeurIPS Workshop 2023</text>
  <text x="161" y="223" text-anchor="middle" font-size="8" fill="#64748b" font-family="Inter, sans-serif">ECML-PKDD 2024</text>
</svg>
